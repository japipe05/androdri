<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #0078FF;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            color: #333;
        }
        .content p {
            font-size: 16px;
            line-height: 1.5;
        }
        .footer {
            text-align: center;
            background-color: #f0f0f0;
            padding: 10px;
            font-size: 13px;
            color: #777;
        }
        .highlight {
            color: #0078FF;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            🚀 FastAPI Androdri
        </div>
        <div class="content">
            <h3>📩 Mensaje recibido desde la API:</h3>
            <p>{{ message }}</p>
            <hr>
            <p>📬 Receptor: <span class="highlight">{{ name }} - {{ email }}</span></p>
        </div>
        <div class="footer">
            💡 Este correo fue enviado automáticamente por <b>FastAPI Androdri</b> 
        </div>
    </div>
</body>
</html>
