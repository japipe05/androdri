version: "3.9"

services:
  whatsapp-messages:
    build:
      context: ./Backend/public/whatsapp-messages
      dockerfile: Dockerfile
    container_name: androdri-backend-pub001-whatsapp-messages
    image: japipe05/androdri-backend-pub001-whatsapp-messages:dev-v1.0.0-20251107
    env_file: ./Backend/public/whatsapp-messages/.env
    ports:
      - "8000:8000"
    networks:
      - androdri-net

  mails:
    build:
      context: ./Backend/public/mails
      dockerfile: Dockerfile
    container_name: androdri-backend-pub002-mails
    image: japipe05/androdri-backend-pub002-mails:dev-v1.0.0-20251107
    env_file: ./Backend/public/mails/.env
    ports:
      - "8001:8000"
    networks:
      - androdri-net
    depends_on:
      - whatsapp-messages

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: androdri-frontend
    image: japipe05/androdri-frontend:dev-v1.0.0-20251107
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    networks:
      - androdri-net
    depends_on:
      - mails
      - whatsapp-messages

networks:
  androdri-net:
    driver: bridge
